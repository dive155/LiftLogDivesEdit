services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: liftlog
      POSTGRES_USER: liftlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftlog -d liftlog"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m

  api:
    build:
      context: ../../backend
      dockerfile: LiftLog.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UserDataContext: Host=postgres;Port=5432;Database=liftlog;Username=liftlog;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ConnectionStrings__RateLimitContext: Host=postgres;Port=5432;Database=liftlog;Username=liftlog;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - 127.0.0.1:5265:8080
    mem_limit: 384m

volumes:
  postgres-data:
