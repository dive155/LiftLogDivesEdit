# Include this inside the existing HTTPS server block for divefrom.space.

location = /liftlog {
    return 301 /liftlog/;
}

location /liftlog/ {
    alias /projects/LiftLog/web/;
    try_files $uri $uri/ /liftlog/index.html;
}

location = /liftlog-api {
    return 308 /liftlog-api/;
}

location /liftlog-api/ {
    proxy_pass http://127.0.0.1:5265/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
